version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metapilot_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - EXECUTION_MODE=demo
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metapilot_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
